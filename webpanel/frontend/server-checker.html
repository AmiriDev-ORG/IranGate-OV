<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Checker - IranGate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/dark-theme.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/theme-overrides.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/theme-overrides.css">
    <script src="js/particles.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/theme-loader.js"></script>
    <script src="js/theme-loader.js"></script>
</head>
<body>
    <div class="main-content">
        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Server Checker</h1>
                    <p class="text-gray-600">Monitor your server connectivity from multiple Iranian locations</p>
                </div>
                <div class="flex space-x-4">
                    <button onclick="refreshStatus()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Check Mode Selection -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Check Mode</h3>
                <div class="space-y-4">
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center">
                            <input type="radio" name="checkMode" value="current_server" checked class="mr-2">
                            <span class="text-gray-700">Current Server</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="checkMode" value="custom_ip" class="mr-2">
                            <span class="text-gray-700">Enter Custom IP</span>
                        </label>
                    </div>
                    
                    <div id="customIpInput" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-2">IP Address</label>
                        <input type="text" id="customIp" placeholder="Enter IP address (e.g., 8.8.8.8)" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <button onclick="startPingCheck()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        Start Ping Check
                    </button>
                </div>
            </div>

            <!-- Current Check Status -->
            <div id="currentCheck" class="hidden bg-white rounded-lg shadow-lg p-6 mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Active Check</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <div class="text-sm text-blue-600 font-medium">Request ID</div>
                        <div id="requestId" class="text-lg font-semibold text-blue-800">-</div>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg">
                        <div class="text-sm text-green-600 font-medium">Status</div>
                        <div id="checkStatus" class="text-lg font-semibold text-green-800">Pending</div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <div class="text-sm text-purple-600 font-medium">Host</div>
                        <div id="checkHost" class="text-lg font-semibold text-purple-800">-</div>
                    </div>
                </div>
                
                <div id="permanentLink" class="hidden mb-4">
                    <a id="reportLink" href="#" target="_blank" class="text-blue-600 hover:text-blue-800 underline">
                        View Full Report on check-host.net
                    </a>
                </div>
                
                <!-- Node Results Grid -->
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Node</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">RTT</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Responder</th>
                            </tr>
                        </thead>
                        <tbody id="nodeResults" class="bg-white divide-y divide-gray-200">
                            <!-- Results will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Check History -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Recent Checks</h3>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Host</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nodes</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Avg RTT</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                            </tr>
                        </thead>
                        <tbody id="checkHistory" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-4 py-8 text-center text-gray-500">No checks performed yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRequestId = null;
        let statusInterval = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication first
            const token = localStorage.getItem('token');
            if (!token) {
                showToast('Please log in first', 'error');
                window.location.href = 'index.html';
                return;
            }
            
            initSidebar('server-checker');
            setupModeToggle();
            loadCheckHistory();
        });

        // Setup mode toggle
        function setupModeToggle() {
            const radioButtons = document.querySelectorAll('input[name="checkMode"]');
            const customIpInput = document.getElementById('customIpInput');
            
            radioButtons.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.value === 'custom_ip') {
                        customIpInput.classList.remove('hidden');
                    } else {
                        customIpInput.classList.add('hidden');
                    }
                });
            });
        }

        // Start ping check
        async function startPingCheck() {
            const mode = document.querySelector('input[name="checkMode"]:checked').value;
            const customIp = document.getElementById('customIp').value;
            
            if (mode === 'custom_ip' && !customIp) {
                showToast('Please enter an IP address', 'error');
                return;
            }

            const requestData = {
                mode: mode,
                host: customIp || ''
            };

            try {
                showLoading('Starting ping check...');
                
                // Get auth token
                const token = localStorage.getItem('token');
                if (!token) {
                    showToast('Please log in first', 'error');
                    window.location.href = 'index.html';
                    return;
                }
                
                const response = await fetch('/api/server-checker/ping', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (jsonError) {
                    throw new Error(`Invalid JSON response: ${jsonError.message}. Response: ${responseText.substring(0, 200)}`);
                }
                
                if (result.success) {
                    currentRequestId = result.data.request_id;
                    document.getElementById('requestId').textContent = currentRequestId;
                    document.getElementById('checkHost').textContent = result.data.host || 'Current Server';
                    
                    if (result.data.permanent_link) {
                        document.getElementById('reportLink').href = result.data.permanent_link;
                        document.getElementById('permanentLink').classList.remove('hidden');
                    }
                    
                    document.getElementById('currentCheck').classList.remove('hidden');
                    
                    // Start polling for results
                    startStatusPolling();
                    
                    showToast('Ping check initiated successfully', 'success');
                } else {
                    showToast(result.message || 'Failed to start ping check', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Start polling for status updates
        function startStatusPolling() {
            if (statusInterval) {
                clearInterval(statusInterval);
            }
            
            statusInterval = setInterval(async () => {
                await checkStatus();
            }, 3000); // Check every 3 seconds
            
            // Initial check
            checkStatus();
        }

        // Check status
        async function checkStatus() {
            if (!currentRequestId) return;

            try {
                // Get auth token
                const token = localStorage.getItem('token');
                if (!token) {
                    console.error('No auth token available');
                    return;
                }
                
                const response = await fetch(`/api/server-checker/status/${currentRequestId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (jsonError) {
                    throw new Error(`Invalid JSON response: ${jsonError.message}. Response: ${responseText.substring(0, 200)}`);
                }
                
                if (result.success) {
                    updateStatusDisplay(result.data);
                    
                    if (result.data.status === 'completed') {
                        clearInterval(statusInterval);
                        statusInterval = null;
                        loadCheckHistory(); // Refresh history
                    }
                }
            } catch (error) {
                console.error('Status check failed:', error);
            }
        }

        // Update status display
        function updateStatusDisplay(status) {
            document.getElementById('checkStatus').textContent = status.status;
            
            // Update node results
            const tbody = document.getElementById('nodeResults');
            tbody.innerHTML = '';
            
            if (status.nodes && status.nodes.length > 0) {
                status.nodes.forEach(node => {
                    const row = document.createElement('tr');
                    
                    // Get the best result for this node
                    let bestResult = null;
                    if (node.results && node.results.length > 0) {
                        bestResult = node.results[0]; // Take first result
                    }
                    
                    const statusText = bestResult ? bestResult.status : 'PENDING';
                    const rttText = bestResult && bestResult.rtt ? `${bestResult.rtt.toFixed(2)}ms` : '-';
                    const responderText = bestResult ? bestResult.responder || '-' : '-';
                    
                    // Status badge
                    let statusClass = 'px-2 py-1 rounded-full text-xs font-medium ';
                    switch (statusText) {
                        case 'OK':
                            statusClass += 'bg-green-100 text-green-800';
                            break;
                        case 'TIMEOUT':
                            statusClass += 'bg-red-100 text-red-800';
                            break;
                        case 'MALFORMED':
                            statusClass += 'bg-yellow-100 text-yellow-800';
                            break;
                        default:
                            statusClass += 'bg-gray-100 text-gray-800';
                    }
                    
                    row.innerHTML = `
                        <td class="px-4 py-3 text-sm text-gray-900">${node.node_name}</td>
                        <td class="px-4 py-3 text-sm text-gray-900">${node.location}</td>
                        <td class="px-4 py-3">
                            <span class="${statusClass}">${statusText}</span>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-900">${rttText}</td>
                        <td class="px-4 py-3 text-sm text-gray-900">${responderText}</td>
                    `;
                    
                    tbody.appendChild(row);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">Loading results...</td></tr>';
            }
        }

        // Load check history
        async function loadCheckHistory() {
            try {
                // Get auth token
                const token = localStorage.getItem('token');
                if (!token) {
                    console.error('No auth token available');
                    return;
                }
                
                const response = await fetch('/api/server-checker/history', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (jsonError) {
                    throw new Error(`Invalid JSON response: ${jsonError.message}. Response: ${responseText.substring(0, 200)}`);
                }
                
                if (result.success) {
                    updateHistoryDisplay(result.data.history || []);
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        // Update history display
        function updateHistoryDisplay(history) {
            const tbody = document.getElementById('checkHistory');
            tbody.innerHTML = '';
            
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No checks performed yet</td></tr>';
                return;
            }
            
            history.forEach(check => {
                const row = document.createElement('tr');
                const timestamp = new Date(check.timestamp).toLocaleString();
                const avgRtt = check.summary && check.summary.average_rtt ? 
                    `${check.summary.average_rtt.toFixed(2)}ms` : '-';
                
                row.innerHTML = `
                    <td class="px-4 py-3 text-sm text-gray-900">${timestamp}</td>
                    <td class="px-4 py-3 text-sm text-gray-900">${check.host}</td>
                    <td class="px-4 py-3 text-sm text-gray-900">${check.summary ? check.summary.successful_nodes : 0}/${check.summary ? check.summary.total_nodes : 0}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">${check.status}</span>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-900">${avgRtt}</td>
                    <td class="px-4 py-3 text-sm text-gray-900">
                        <a href="${check.permanent_link}" target="_blank" class="text-blue-600 hover:text-blue-800 underline">View</a>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Refresh status
        function refreshStatus() {
            if (currentRequestId) {
                checkStatus();
            } else {
                loadCheckHistory();
            }
        }

        // Utility functions
        function showToast(message, type) {
            // Simple toast implementation
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg text-white z-50 ${
                type === 'success' ? 'bg-green-600' : 
                type === 'error' ? 'bg-red-600' : 'bg-blue-600'
            }`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 3000);
        }

        function showLoading(message) {
            // Simple loading implementation
            const loading = document.createElement('div');
            loading.id = 'loading';
            loading.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            loading.innerHTML = `
                <div class="bg-white rounded-lg p-6 flex items-center">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600 mr-3"></div>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(loading);
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                document.body.removeChild(loading);
            }
        }
    </script>
</body>
</html>
